# Resource metrics API: `kubectl top` and the HorizontalPodAutoscaler.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/kube-system/metrics-server/app
  prune: true
  wait: true
