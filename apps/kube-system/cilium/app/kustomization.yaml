apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
# The values live in a plain file because the Makefile needs them too.
configMapGenerator:
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    # Makes the HelmRelease reconcile when the values change.
    reconcile.fluxcd.io/watch: Enabled
