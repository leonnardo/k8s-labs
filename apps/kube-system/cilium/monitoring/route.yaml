# http://hubble.localhost:8080
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  parentRefs:
    - name: ingress
      namespace: istio-ingress
  hostnames:
    - hubble.localhost
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
