# The CNI. `make up` installs it before Flux exists, because no pod can start
# without it; this Kustomization takes the Helm release over.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/kube-system/cilium/app
  prune: true
  wait: true
---
# What depends on other components: the monitors need the Prometheus CRDs and
# the Hubble UI needs the ingress Gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
    - name: kube-prometheus-stack
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/kube-system/cilium/monitoring
  prune: true
  wait: true
---
# Cluster-wide network policy. A separate Kustomization because Cilium creates
# its CRDs when it starts, not from the chart.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/kube-system/cilium/policies
  prune: true
  wait: true
