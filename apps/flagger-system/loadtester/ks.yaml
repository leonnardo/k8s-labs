# Runs the commands that a Canary's webhooks ask for, such as generating load
# during an analysis.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loadtester
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/flagger-system/loadtester/app
  prune: true
  wait: true
