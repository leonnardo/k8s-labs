# For Gateways implemented by Istio. The metrics come from the Gateway's
# Envoy (reporter="source"), so they only cover traffic that enters through
# it. `target` is the Deployment under analysis, which runs the new version.
#
# Share of requests answered with a 5xx, in percent.
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: istio-error-rate
  namespace: flagger-system
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability:9090
  query: |
    100 - sum(
      rate(
        istio_requests_total{
          reporter="source",
          destination_workload_namespace="{{ namespace }}",
          destination_workload="{{ target }}",
          response_code!~"5.*"
        }[{{ interval }}]
      )
    )
    /
    sum(
      rate(
        istio_requests_total{
          reporter="source",
          destination_workload_namespace="{{ namespace }}",
          destination_workload="{{ target }}"
        }[{{ interval }}]
      )
    )
    * 100
---
# 99th percentile of the request duration, in seconds.
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: istio-latency
  namespace: flagger-system
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability:9090
  query: |
    histogram_quantile(0.99,
      sum(
        rate(
          istio_request_duration_milliseconds_bucket{
            reporter="source",
            destination_workload_namespace="{{ namespace }}",
            destination_workload="{{ target }}"
          }[{{ interval }}]
        )
      ) by (le)
    ) / 1000
