# Control plane.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 1h
  url: oci://ghcr.io/istio/release/charts/istiod
  ref:
    tag: 1.32.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 1h
  dependsOn:
    - name: istio-base
  chartRef:
    kind: OCIRepository
    name: istiod
  values:
    profile: ambient
    # Envoy proxies (the Gateways; ztunnel does not trace) send a span for
    # every request to the collector.
    meshConfig:
      enableTracing: true
      extensionProviders:
        - name: otel
          opentelemetry:
            service: otel-agent-collector.observability.svc.cluster.local
            port: 4317
      # Naming any default provider replaces the built-in defaults, so the
      # Prometheus metrics that Flagger relies on have to be listed as well.
      defaultProviders:
        metrics:
          - prometheus
        tracing:
          - otel
    pilot:
      traceSampling: 100
