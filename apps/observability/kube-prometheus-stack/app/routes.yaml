apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: ingress
      namespace: istio-ingress
  hostnames:
    - grafana.localhost
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: observability
spec:
  parentRefs:
    - name: ingress
      namespace: istio-ingress
  hostnames:
    - prometheus.localhost
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: observability
spec:
  parentRefs:
    - name: ingress
      namespace: istio-ingress
  hostnames:
    - alertmanager.localhost
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
