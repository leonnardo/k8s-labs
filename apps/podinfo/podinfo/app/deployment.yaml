# Changing the pod template starts a canary release. Flagger copies this
# Deployment to podinfo-primary, which serves the traffic, and keeps this one
# at zero replicas between releases. No `replicas` here, so that Flux does not
# undo that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: podinfo
spec:
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
        # Flagger rewrites `app` on the primary; this one is the same on both
        # and is what the AuthorizationPolicy selects.
        app.kubernetes.io/name: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_UI_MESSAGE
              value: hello from k8s-labs
            # Send a span per request, continuing the trace that the
            # Gateway started.
            - name: PODINFO_OTEL_SERVICE_NAME
              value: podinfo
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-agent-collector.observability:4317
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
