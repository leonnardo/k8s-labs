# The proxy that handles HTTP for traffic between pods in this namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-waypoint
  namespace: flux-system
spec:
  dependsOn:
    - name: istio
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/podinfo/waypoint/app
  prune: true
  # Flux sees a Gateway as ready as soon as it is applied. What has to be up
  # is the Envoy that Istio deploys for it.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: waypoint
      namespace: podinfo
