# Istio in ambient mode. Ready once all four Helm releases are.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./istio
  prune: true
  wait: true
