# Scrape targets for Istio. Separate from ./istio because the monitor CRDs
# only exist once kube-prometheus-stack is installed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: istio
    - name: kube-prometheus-stack
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./istio-monitoring
  prune: true
  wait: true
