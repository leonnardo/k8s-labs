# Istio deploys an Envoy and a Service for this Gateway. Routes in any
# namespace can attach to it with a hostname under *.localhost.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: ingress-options
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.localhost"
      allowedRoutes:
        namespaces:
          from: All
---
# kind has no LoadBalancer, so the Service is a NodePort on the port that
# bootstrap/kind.yaml maps to localhost:8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-options
  namespace: istio-ingress
data:
  service: |
    spec:
      type: NodePort
      ports:
        - port: 80
          nodePort: 30080
