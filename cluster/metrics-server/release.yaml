# The chart is not published as an OCI artifact, hence the HelmRepository.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  values:
    args:
      # kind's kubelet serves a self-signed certificate.
      - --kubelet-insecure-tls
