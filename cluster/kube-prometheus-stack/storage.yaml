# Class for volumes that are created by hand on the host directory. Nothing
# provisions it; the Prometheus Operator only requires the class to exist.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: host
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
# Prometheus data, kept on the host under the directory that
# bootstrap/kind.yaml mounts at /var/lib/k8s-labs. The claim that the operator
# creates for Prometheus binds to this volume through the label.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus
  labels:
    k8s-labs/volume: prometheus
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: host
  hostPath:
    path: /var/lib/k8s-labs/prometheus
    type: Directory
