# OCI registry that holds the artifact Flux syncs from.
#
# Applied by `make registry` and not managed by Flux: it has to exist before
# Flux has anything to sync.
#
# Storage is an emptyDir, so the artifact is lost when the pod is replaced.
# Run `make sync` to push it again.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:3.1.2
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      # Mapped to localhost:5050 on the host by bootstrap/kind.yaml.
      nodePort: 30500
