# kind cluster for the lab. The cluster name comes from the Makefile.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # In-cluster registry (bootstrap/registry.yaml), where `make sync` pushes.
      # Host port 5050 because macOS AirPlay Receiver holds 5000.
      - containerPort: 30500
        hostPort: 5050
        listenAddress: 127.0.0.1
      # Ingress Gateway (apps/istio-ingress/ingress/app/gateway.yaml): http://<name>.localhost:8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
    extraMounts:
      # Data that outlives the cluster. The Makefile replaces DATA_DIR with a
      # directory on the host; PersistentVolumes point below the container path.
      - hostPath: DATA_DIR
        containerPath: /var/lib/k8s-labs
# kubeadm binds the metrics endpoints of these components to localhost, where
# Prometheus cannot reach them.
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        - name: bind-address
          value: 0.0.0.0
    scheduler:
      extraArgs:
        - name: bind-address
          value: 0.0.0.0
    etcd:
      local:
        extraArgs:
          - name: listen-metrics-urls
            value: http://0.0.0.0:2381
  - |
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    kind: KubeProxyConfiguration
    metricsBindAddress: 0.0.0.0:10249
